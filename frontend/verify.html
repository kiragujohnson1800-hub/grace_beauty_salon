<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6efeb">
  <title>Verify your email | Grace Beauty Salon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="verify-page">
  <main class="verify-wrap">
    <a class="brand" href="index.html" aria-label="Grace Beauty Salon home"><span class="brand-mark">G</span><span>grace<span class="brand-sub">BEAUTY SALON</span></span></a>
    <form class="verify-card" data-auth-form="verify">
      <div class="verify-icon" aria-hidden="true">✉</div>
      <p class="eyebrow">ONE LAST STEP</p>
      <h1>Check your inbox</h1>
      <p class="muted">We sent a six-digit verification code to <strong data-verify-email>your email address</strong>.</p>
      <div class="form-alert" data-alert role="alert" hidden></div>
      <input type="hidden" name="email" data-verify-email-input>
      <label class="field-label" for="otp-code">Verification code</label>
      <input class="input otp-input" id="otp-code" name="otp" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="000000" required>
      <span class="field-help">Enter the 6-digit code. It expires after 10 minutes.</span>
      <button class="button button-primary button-wide" type="submit">Verify email <span aria-hidden="true">→</span></button>
      <p class="resend-copy">Didn't receive it? <button class="text-button" type="button" data-resend>Send a new code</button></p>
      <a class="back-link" href="index.html">← Back to sign in</a>
    </form>
    <p class="form-footnote">Grace Beauty Salon · Your moment, your glow.</p>
  </main>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
